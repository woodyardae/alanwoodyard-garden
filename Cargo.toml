[workspace]
resolver = "2"
members = [
    "crates/bosun-garden-core",
    "crates/bosun-garden-compiler",
    "apps/bosun-garden-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Bosun PKM Project"]

[workspace.dependencies]
bosun-garden-core = { path = "crates/bosun-garden-core" }
bosun-garden-compiler = { path = "crates/bosun-garden-compiler" }
marlinspike-ast = { path = "../marlinspike/crates/marlinspike-ast" }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde_json = "1.0"
thiserror = "1.0"
yaml-rust2 = "0.10"
